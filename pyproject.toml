[project]
name = "cost-accounting"
version = "0.1.0"
description = ""
authors = [
    {name = "ivxmirov", email = "iterum343@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1,<0.136.0",
    "uvicorn>=0.42.0,<0.43.0",
    "sqlalchemy>=2.0.48,<3.0.0",
    "aiohttp>=3.13.5,<4.0.0",
    "asyncpg>=0.31.0",
    "aioresponses>=0.7.9",
    "requests>=2.34.2",
    "pyjwt>=2.13.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "aiosqlite>=0.22.1",
    "httpx2>=2.5.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
    "alembic>=1.18.5",
    "ty>=0.0.73",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov>=7.1.0",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
# Автоматически определяет асинхронные тесты и запускает их в event loop
asyncio_mode = "auto"
# Каждый тест получает свой собственный event loop (изолированные тесты)
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Максимальная длина строки - 100 символов (PEP 8 рекомендует 79, но 100 - современный стандарт)
line-length = 100
# Целевая версия Python для проверки синтаксиса и правил
target-version = "py312"
# Папки, которые Ruff не будет проверять
exclude = [
    "alembic/**",
    "tests/**",
    "test-reports/**",
]

[tool.ruff.lint]
# Набор правил для проверки кода
select = [
    "E",   # pycodestyle errors - ошибки стиля
    "W",   # pycodestyle warnings - предупреждения стиля
    "F",   # pyflakes - ошибки кода
    "I",   # isort - порядок импортов
    "N",   # pep8-naming - именование
    "B",   # flake8-bugbear - поиск багов и потенциальных проблем
    "A",   # flake8-builtins - проверка затенения встроенных функций
    "C4",  # flake8-comprehensions - упрощение comprehensions
    "SIM", # flake8-simplify - упрощение кода
    "RET", # flake8-return - проверка return в функциях
    "ARG", # flake8-unused-arguments - неиспользуемые аргументы
    "PTH", # flake8-use-pathlib - использование pathlib вместо os.path
    "UP",  # pyupgrade - обновление синтаксиса до новых версий Python
    "ASYNC", # async-specific - проверки для асинхронного кода
]

# Игнорировать определенные правила
ignore = [
    "B008",  # Вызов функций в аргументах по умолчанию (часто бывает нужно)
    "ARG002", # Неиспользуемые аргументы методов (часто нужны для интерфейсов)
]

[tool.ruff.format]
# Форматировать фрагменты кода внутри docstring (примеры кода в документации)
docstring-code-format = true
# Использовать двойные кавычки для строк
quote-style = "double"
# Не уважать "магическую" запятую в конце строки (не переносить элементы, если есть запятая)
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
# Не использовать запятую в конце для разделения импортов при переносе
# (если false - импорты будут в одну строку, если возможно)
split-on-trailing-comma = false

[tool.ty.src]
# Файлы и папки, которые ty БУДЕТ проверять
include = ["app/", "main.py"]
# Файлы и папки, которые ty НЕ будет проверять
exclude = [
    "alembic/",       # Миграции Alembic (автогенерируемый код)
    "migrations/",    # Миграции базы данных
    "test-reports/",  # Отчеты о тестах
    "tests/",         # Тесты (можно проверять отдельно при необходимости)
]
