repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
        exclude: ^(alembic/|\.venv/|venv/)
        
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
        exclude: ^(alembic/|\.venv/|venv/)
        
      - id: ty
        name: ty
        entry: ty check
        language: system
        pass_filenames: false
        args: [app/, main.py]
